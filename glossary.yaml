  Load Game: تحميل لعبة
  Settings: الإعدادات
  Options: الخيارات
  Quit: خروج
  Exit to Main Menu: العودة إلى القائمة الرئيسية
  Main Menu: القائمة الرئيسية
  Back: رجوع
  Resume: استئناف
  Apply: تطبيق
  Cancel: إلغاء
  Confirm: تأكيد
