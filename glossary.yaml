  # إيثان كارتر: صبي في الثانية عشرة، خيالي وحساس، جمل بسيطة

# ===== مصطلحات خاصة بهذه اللعبة (تُضاف أثناء العمل) =====
game_specific: {}

# المصطلحات العامة قد تتغير حسب السياق. لا يطبق الوكيل قيمة عامة إذا كان
# للسياق أو اللعبة قرار موثق مختلف.
context_rules:
  - term: Load
    contexts:
      menu_load_game: تحميل لعبة
      asset_or_data: تحميل
  - term: Continue
    contexts:
      menu_resume: استئناف
      menu_story: متابعة
  - term: Checkpoint
    contexts:
      save_point: نقطة حفظ
      gameplay_objective: نقطة تفتيش
