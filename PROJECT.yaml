game:
  name: "[اسم اللعبة]"
  install_path: "[المسار الكامل للعبة]"
  source_language: "en"
  target_locale: "ar"
  tone: "[نبرة اللعبة والشخصيات]"
  register: "msa"
  dialect_policy: "none-unless-approved"
  digits: "western"
  dates: "gregorian-month-names"
  time_format: "12h"
  quotation_marks: "arabic"
  diacritics: "minimal"
  profanity_policy: "same-intensity-as-source"
  units_policy: "preserve-source-unless-approved"
  native_encoding: "detect-and-preserve"
  working_encoding: "utf-8"
  token_profile: "generic"

workflow:
  engine_profile: ""
  adapter: ""  # e.g. adapters/renpy.py; proven by scripts/adapter_contract.py before bulk translation
  adapter_options: {}
  tools_path: "C:\\LocTools"
  mode: "continuous"
  approval_checkpoints: false
  startup_intake: "ask-once-per-new-game"
  mod_research: "once-after-engine-identification"  # localization-useful mods only; never automatic adoption
  subagent_preference: "ask"  # yes/no after the initial grouped questions
  image_scope: "ask"  # yes/no; image policy still controls what is translated
  install_to_user_copy: "ask"  # ask|yes|no — set once at the new-game intake; a blank template value is never standing permission
  user_playtest_gate: true
  portable_package_after_user_acceptance: true
  allow_launch_game: false
  allow_subagents: true  # capability; subagent_preference controls this game
  subagent_concurrency: "adaptive_no_fixed_limit"
  max_batch_strings: 500
  max_batch_source_tokens: 4000
  max_prompt_overhead_tokens: 1200
  batch_size_is_ceiling: true
  review_policy: "structural-100-percent-adaptive-semantic"
  full_text_review: "only-explicit-high-risk-or-release"
  # أسئلة البداية تُطرح دفعة واحدة. المرحلة الحالية في state/pipeline.json وتتقدم فقط بـ loc.py gate؛ الأسئلة غير المانعة تُجمع في PLAN.md.

image_localization:
  policy_file: "config/image-localization-policy.yaml"
  classification_required: true
  visual_review_required: true
  numeric_only_acceptance: false
  adaptive_candidate_search: true
  preserve_source_if_no_candidate_passes: true
  external_image_editing:
    enabled: "ask"  # ask|yes|no — set at intake only when images are in scope; never inferred from template defaults
    provider: "openai-official"
    authorization_scope: "current-project"
    final_asset_requires_review: true

typography:
  selection: "agent-led-match-game-identity"
  search_external_candidates_when_fit_may_improve: true
  download_verified_fonts_without_repeat_approval: true
  install_selected_font_for_current_windows_user_only_if_required: true
  machine_wide_font_install: false
  font_policy: "references/font-sourcing.md"
  selected_font_registry: "fonts/FONT_USAGE.json"
  user_install_log: "fonts/SYSTEM_INSTALLS.json"
  role_fonts: {}  # Fill only roles the renderer actually supports (for example UI, headings, dialogue).

reporting:
  dashboard: "reports/dashboard.html"  # always regenerated by code; open it in a browser to follow the work
  progress_in_chat: "on_request"  # on_request|batch — when to also print loc.py progress in the conversation

output:
  interchange_format: "auto"
  preserve_native_format: true
  prefer_patch_package: true
